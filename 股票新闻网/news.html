    const IMP = { '利好':'up', '利空':'down', '中性':'flat' };
    const CATS = ['全部','政策','央行','宏观','债市','市场','公司','区域市场','商品'];
    const IMPS = ['全部','利好','利空','中性'];

    const state = { cat:'全部', imp:'全部', q:'' };
    const feed = document.getElementById('feed');
    const catChips = document.getElementById('catChips');
    const impChips = document.getElementById('impChips');
    const statsEl = document.getElementById('stats');

    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]; }); }

    catChips.innerHTML = CATS.map(function (c) { return '<button class="chip' + (c === '全部' ? ' active' : '') + '" data-cat="' + c + '">' + c + '</button>'; }).join('');
    impChips.innerHTML = IMPS.map(function (i) { return '<button class="chip' + (i === '全部' ? ' active' : '') + '" data-imp="' + i + '">' + i + '</button>'; }).join('');

    function counts() {
      const c = { '利好':0, '利空':0, '中性':0 };
      NEWS.forEach(function (n) { c[n.imp]++; });
      statsEl.innerHTML = ['利好','利空','中性'].map(function (k) {
        return '<div class="stat ' + IMP[k] + '">' + k + '<b>' + c[k] + '</b></div>';
      }).join('');
      document.getElementById('total').textContent = NEWS.length;
    }

    function render() {
      const q = state.q.trim().toLowerCase();
      const rows = NEWS.filter(function (n) {
        if (state.cat !== '全部' && n.cat !== state.cat) return false;
        if (state.imp !== '全部' && n.imp !== state.imp) return false;
        if (q && (n.title + n.sum + n.assets.join(' ') + n.src).toLowerCase().indexOf(q) < 0) return false;
        return true;
      }).sort(function (a, b) { return a.d < b.d ? 1 : a.d > b.d ? -1 : 0; });

      if (!rows.length) { feed.innerHTML = '<div class="empty">没有符合条件的消息</div>'; return; }

      feed.innerHTML = rows.map(function (n) {
        return '<article class="item">' +
          '<div class="side">' +
            '<span class="imp ' + IMP[n.imp] + '">' + n.imp + '</span>' +
            '<span class="t">' + esc(n.d.slice(5, 16).replace('-', '月').replace(' ', '日 · ').replace('月0', '月')) + '</span>' +
            '<span class="c">' + esc(n.cat) + '</span>' +
          '</div>' +
          '<div class="body">' +
            '<h3><a href="' + esc(n.url) + '" target="_blank" rel="noopener noreferrer">' + esc(n.title) + '</a></h3>' +
            '<p>' + esc(n.sum) + '</p>' +
            '<div class="foot">' +
              '<span class="assets"><em>影响标的</em>' + n.assets.map(function (a) { return '<i>' + esc(a) + '</i>'; }).join('') + '</span>' +
              '<span class="src">来源：<a href="' + esc(n.url) + '" target="_blank" rel="noopener noreferrer">' + esc(n.src) + '</a></span>' +
            '</div>' +
          '</div>' +
        '</article>';
      }).join('');
    }

    catChips.addEventListener('click', function (e) {
      const b = e.target.closest('[data-cat]'); if (!b) return;
      state.cat = b.dataset.cat;
      catChips.querySelectorAll('.chip').forEach(function (x) { x.classList.toggle('active', x === b); });
      render();
    });
    impChips.addEventListener('click', function (e) {
      const b = e.target.closest('[data-imp]'); if (!b) return;
      state.imp = b.dataset.imp;
      impChips.querySelectorAll('.chip').forEach(function (x) { x.classList.toggle('active', x === b); x.classList.toggle(IMP[b.dataset.imp] || '', x === b && b.dataset.imp !== '全部'); });
      render();
    });
    document.getElementById('search').addEventListener('input', function (e) { state.q = e.target.value; render(); });

    counts();
    render();
  </script>
