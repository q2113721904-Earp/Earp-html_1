    :root{--ink:#172c39;--muted:#71808b;--teal:#0f7a75;--line:#dce6e9}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 4% 2%,#ccebe6,transparent 25%),radial-gradient(circle at 95% 4%,#dde8ff,transparent 28%),#f3f7f8}.topbar{height:66px;padding:0 42px;display:flex;align-items:center;justify-content:space-between;background:#ffffffad;border-bottom:1px solid #fff;backdrop-filter:blur(20px);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;text-decoration:none}.brand-logo{display:block;width:205px;height:48px;object-fit:contain}.back{padding:8px 13px;border:1px solid #c9dcdf;border-radius:7px;color:#286a70;text-decoration:none;font-size:13px;background:#fff9}.page{max-width:940px;margin:32px auto 60px;padding:0 22px}.article{overflow:hidden;border:1px solid #fff;background:#ffffffc1;border-radius:20px;box-shadow:0 18px 45px #33586b18;backdrop-filter:blur(18px)}.hero{width:100%;height:330px;object-fit:cover;display:block}.content{max-width:760px;padding:35px 42px 48px;margin:auto}.tag{display:inline-block;padding:4px 9px;color:#0a6963;background:#d8efeb;border-radius:4px;font-weight:700;font-size:12px}.crumb{margin-bottom:15px;color:#788993;font-size:13px}.crumb a{color:#46777a;text-decoration:none}h1{font-size:31px;letter-spacing:.2px;line-height:1.42;margin:13px 0 10px}.meta{display:flex;gap:8px;color:#81919a;font-size:12px;margin-bottom:24px}.lead{padding:15px 17px;margin:0 0 25px;border-left:3px solid #23a595;background:#eff8f7;color:#39555f;font-size:16px;line-height:1.8}.section{margin:31px 0}.section h2{font-size:20px;margin:0 0 12px}.section p{font-size:15px;line-height:2;color:#40555f;margin:11px 0}.steps{margin:20px 0;padding:0;list-style:none;counter-reset:step}.steps li{position:relative;padding:13px 15px 13px 53px;margin:9px 0;border:1px solid #deeaeb;border-radius:10px;background:#ffffffa8;line-height:1.65;color:#445a64;counter-increment:step}.steps li:before{content:counter(step);position:absolute;left:15px;top:13px;width:25px;height:25px;text-align:center;line-height:25px;border-radius:50%;font-size:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,#149e93,#126977)}.disclaimer{padding:13px 15px;color:#607681;background:#f3f7f8;border-radius:8px;font-size:12px;line-height:1.75}.comments{margin-top:34px;padding-top:25px;border-top:1px solid var(--line)}.comments h2{margin:0 0 13px}.form{display:flex;gap:10px}.input{flex:1;padding:11px 12px;border:1px solid #cbdcdf;border-radius:8px;background:#fff;font:inherit;font-size:13px;outline:0}.input:focus{border-color:#4eb7ab;box-shadow:0 0 0 3px #4eb7ab22}.post{border:0;padding:0 16px;border-radius:8px;background:linear-gradient(135deg,#148b82,#0e6572);color:#fff;font-weight:700;cursor:pointer}.comment{padding:13px 0;border-bottom:1px solid #e9eff0;font-size:13px;color:#4a606a}.comment strong{display:block;margin-bottom:5px;color:#1b3e49;font-size:12px}@media(max-width:700px){.topbar{padding:0 18px}.brand-logo{width:165px}.page{padding:0 10px;margin-top:15px}.content{padding:25px 22px}.hero{height:220px}h1{font-size:25px}}

<body>
  <header class="topbar"><a class="brand" href="index.html"><img class="brand-logo" src="brand-logo.svg" alt="环球市场雷达"></a><a class="back" href="index.html#news">← 返回新闻中心</a></header>
  <main class="page"><article class="article"><img class="hero" id="hero" alt="文章配图"><div class="content"><div class="crumb"><a href="index.html">首页</a> / <a href="index.html#news">新闻中心</a> / 深度解读</div><span class="tag" id="tag"></span><h1 id="title"></h1><div class="meta" id="meta"></div><p class="lead" id="lead"></p><div id="sections"></div><div class="disclaimer" id="source"></div><section class="comments"><h2>评论</h2><div class="form"><input class="input" id="commentInput" placeholder="说说你的看法…"><button class="post" id="post">发布</button></div><div id="commentList"><div class="comment"><strong>市场观察者 · 刚刚</strong>这种逐层拆解的方式很清晰，期待后续能标注每个变量对应的资产。</div></div></section></div></article></main>
  <script>
    const stories=[
      {tag:'宏观观察',time:'10月10日 · 08:30',img:'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=1600&q=82',title:'美债与油价仍是全球股市的两条“压力线”',lead:'长端美债收益率维持高位、油价波动加剧，使市场重新审视企业估值与通胀路径。下面按“事件—传导—验证”的顺序拆解。',source:'资料说明：本文为对公开市场报道的原创梳理，参考 AP News 10月9日市场收盘报道与 Reuters 10月7日全球市场报道。内容仅供信息交流，不构成投资建议。',sections:[['先看发生了什么','近期市场反复围绕两个价格变量定价：一是美国长期国债收益率，二是原油价格。前者决定资本的机会成本，后者影响通胀预期和企业成本。二者任意一个快速上行，都可能使股票估值承压；若同步上行，市场往往会更谨慎。','新闻本身并非唯一驱动。投资者需要区分“短时波动”与“趋势确认”：一日的收益率上跳，可能只是拍卖、仓位或流动性造成；连续多日走高，且伴随美元偏强、通胀预期抬升，才更值得视作金融条件收紧。'],['第一步：收益率如何传导至股票','股价可以理解为未来利润的折现值。长期收益率上升时，较远年份的利润价值会被更高的折现率压低，因此盈利主要在未来释放的成长公司通常更加敏感。','这并不意味着所有股票都会同幅下跌。银行、保险等部分行业可能受益于利率结构变化；现金流稳定、估值较低的公司也可能相对抗压。观察的重点应是行业间的相对表现，而非只看大盘涨跌。'],['第二步：油价为何会影响更广','原油价格先影响能源企业收入和运输成本，随后可能传导至物流、化工、航空及消费者的可支配收入。如果价格上升被认为会持续，市场会担心通胀回落变慢，进而重新调整对利率的预期。','但油价上升的原因同样重要：若由需求改善推动，部分周期行业可能受益；若由供给扰动造成，则更容易带来成本冲击。阅读新闻时，应优先判断价格变化的来源。'],['第三步：把两条线放在一起验证','可以按三个信号检查风险是否在累积：第一，10年期收益率是否连续走高；第二，油价是否在高位扩大波动；第三，美元是否同步走强。三个信号同时出现，通常意味着全球资金对高估值资产更挑剔。','反过来，如果油价回落或债券买盘带动收益率下降，市场的压力可能缓解。此时还要观察科技、可选消费等利率敏感板块能否重新领涨，以判断是否只是技术性反弹。'],['接下来应该看什么','短线需要留意通胀数据、就业数据、央行表态以及国债拍卖需求；中线则关注企业盈利能否覆盖更高的融资成本。对于资产面板而言，可将美债10年期、美元指数、WTI与布伦特原油放在同一视图，便于判断联动是否加剧。']]},
      {tag:'科技与公司',time:'10月10日 · 07:50',img:'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1600&q=82',title:'AI交易未退场，但高利率环境正在考验科技股韧性',lead:'AI产业链仍是市场焦点，不过在较高利率环境中，投资者会更严格追问：投入何时变成收入，收入能否转化为现金流。',source:'资料说明：本文为原创市场解读，参考 Reuters 10月6日全球市场报道中关于大型科技股与AI交易的市场信息；不构成投资建议。',sections:[['从热度到验证','AI主题带来的不是单一公司行情，而是一条跨越芯片、代工、存储、云服务与软件应用的产业链。上游订单改善的同时，不代表每一个环节都能以同样速度兑现利润。','因此，新闻阅读的起点不应只是“某只股票上涨”，而应问三个问题：增长来自真实需求还是库存回补？客户是否持续增加资本开支？毛利率与自由现金流是否同步改善？'],['第一步：拆开产业链','算力芯片和晶圆代工通常对大客户资本开支最敏感；高带宽存储的供需则反映系统配置的变化；云服务商的订单与利用率，决定了上游投入能否持续。最后，企业软件和终端应用能否创造收入，影响整条链的长期回报。','把英伟达、台积电、三星电子与SK海力士放入同一观察清单，并不是因为它们走势必然一致，而是因为它们共同提供了对AI需求不同侧面的验证。'],['第二步：理解利率的“放大器”作用','高估值科技股对长期收益率更敏感。市场支付的价格中包含了对多年后增长的预期；当折现率上行，即便盈利预测不变，合理估值也可能下调。','所以“业绩好但股价下跌”并不矛盾。公司层面的经营数据和宏观层面的估值环境，可能朝相反方向发力。看新闻时，应同时阅读财报指引与利率背景。'],['第三步：如何辨别行情质量','较健康的行情通常表现为：订单、营收、利润率和现金流至少有两三项同步改善，且上涨不只集中在极少数公司。若只有估值扩张、没有基本面数据跟随，波动风险会更高。','还可以观察半导体设备、存储和云服务之间是否出现确认。上游强、下游弱时，市场可能在提前交易预期；上下游一起改善，趋势的基础通常更扎实。'],['后续跟踪清单','建议把公司新闻划分为“订单与供给”“资本开支”“产品节奏”“利润率与现金流”四类。每一条消息只回答一个问题，再与美债收益率的变化交叉查看，能减少被短期标题牵着走。']]},
      {tag:'区域市场',time:'10月10日 · 07:15',img:'https://images.unsplash.com/photo-1526304640581-d334cdbbf45e?auto=format&fit=crop&w=1600&q=82',title:'全球股市收官偏强，区域分化仍取决于能源与汇率',lead:'相同的全球宏观新闻，落在不同市场上可能产生不同结果。区域指数需要结合本币、行业权重与能源暴露来阅读。',source:'资料说明：本文为原创市场解读，参考 AP News 10月9日美股收盘报道及 Reuters 10月5日至7日全球市场报道；不构成投资建议。',sections:[['为什么指数表现不同','指数不是一个抽象数字，而是一篮子行业与公司的加权结果。科技权重较高的市场对利率和AI主题更敏感；资源股占比较高的市场对原油、铜价更敏感；出口导向市场还会受本币汇率明显影响。','因此，单纯比较“哪个市场涨得更多”信息有限。更有用的方式，是先看该市场前三大权重行业，再寻找对应的全球变量。'],['第一步：看能源敞口','能源出口国或资源股权重高的市场，油价上升可能为指数提供支撑；能源进口比重高的市场，则可能面对企业成本与消费者压力。铜、铁矿石等工业品同样会影响资源型经济体。','这解释了为何全球油价新闻出现后，英国、巴西等市场与日韩、欧洲部分市场的反应可能并不一致。'],['第二步：看汇率与资金流','美元走强通常会影响以美元计价的资本流动，并增加部分新兴市场的外部融资压力。但这不是机械关系：经常账户、外汇储备和本地利率环境也会改变结果。','观察区域市场时，指数、对美元汇率与当地国债收益率最好一同查看。三者同时变化时，往往比单一股市涨跌更能说明资金情绪。'],['第三步：看核心权重股','韩国市场可重点观察存储与半导体龙头；日本市场还需考虑日元和出口企业；港股则兼具中概科技与中国宏观预期。不同市场的“指数新闻”，最终都会落到少数权重股与行业的盈利预期上。','这也是本面板保留区域指数和行业龙头两个分类的原因：先从指数看到市场情绪，再回到权重股寻找情绪的来源。'],['实用观察顺序','建议按“全球变量→区域指数→权重行业→龙头公司”的顺序阅读。若原油、美元和美债收益率出现同向变化，再看哪些区域指数最敏感，最后检查相应权重股是否确认。这样能把零散新闻连成更清晰的传导链。']]}
    ];
    const id=Math.max(0,Math.min(stories.length-1,Number(new URLSearchParams(location.search).get('id'))||0)),s=stories[id];
    const el=name=>document.getElementById(name), heroEl=el('hero'), tagEl=el('tag'), titleEl=el('title'), metaEl=el('meta'), leadEl=el('lead'), sectionsEl=el('sections'), sourceEl=el('source'), inputEl=el('commentInput'), postEl=el('post'), commentListEl=el('commentList');
    document.title=s.title+' · 环球市场雷达';heroEl.src=s.img;heroEl.alt=s.title;tagEl.textContent=s.tag;titleEl.textContent=s.title;metaEl.innerHTML=`<span>${s.time}</span><span>·</span><span>环球市场雷达 · 深度解读</span>`;leadEl.textContent=s.lead;sectionsEl.innerHTML=s.sections.map(([h,...ps])=>`<section class="section"><h2>${h}</h2>${ps.map(p=>`<p>${p}</p>`).join('')}</section>`).join('');sourceEl.textContent=s.source;
    postEl.onclick=()=>{const v=inputEl.value.trim();if(!v)return;const c=document.createElement('div');c.className='comment';c.innerHTML='<strong>访客 · 刚刚</strong>'+v.replace(/[<>]/g,'');commentListEl.prepend(c);inputEl.value=''};inputEl.onkeydown=e=>{if(e.key==='Enter')postEl.click()};
  </script>
