    function renderStats(group) {
      const rows = group.rows, n = rows.length, num = r => parseFloat(r[3]);
      const ups = rows.filter(r => num(r) > 0).length;
      const downs = rows.filter(r => num(r) < 0).length;
      const flats = n - ups - downs;
      const avg = rows.reduce((s, r) => s + num(r), 0) / n;
      const sorted = rows.slice().sort((a, b) => num(b) - num(a));
      const top = sorted[0], bottom = sorted[n - 1];
      const sign = v => (v > 0 ? '+' : '') + v.toFixed(2) + '%';
      const cls = v => v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
      document.getElementById('statRow').innerHTML =
        '<div class="stat-tile"><span class="k">涨跌家数</span><span class="v"><span class="up">' + ups + '</span><em>/</em><span class="down">' + downs + '</span></span><span class="s">共 ' + n + ' 项' + (flats ? ' · 持平 ' + flats : '') + '</span></div>' +
        '<div class="stat-tile"><span class="k">平均涨跌幅</span><span class="v ' + cls(avg) + '">' + sign(avg) + '</span><span class="s">' + group.name + '</span></div>' +
        '<div class="stat-tile"><span class="k">领涨</span><span class="v name ' + cls(num(top)) + '">' + top[0] + '</span><span class="s">' + sign(num(top)) + '</span></div>' +
        '<div class="stat-tile"><span class="k">领跌</span><span class="v name ' + cls(num(bottom)) + '">' + bottom[0] + '</span><span class="s">' + sign(num(bottom)) + '</span></div>';
    }
